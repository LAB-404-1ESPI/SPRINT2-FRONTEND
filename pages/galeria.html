<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="../src/css/galeria.css">
    <!-- API EXTERNA -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

    <title>GALERIA</title>

</head>
<body> 
    <header>
        <h1>GALERIA <span id="titulojovix">JOVIX</span></h1>
    </header>
    <main>
        <div class="container">
            
            <div class="span">
                <span></span>
            </div>
                
            <video id="video" autoplay playsinline></video>
            <button id="btn-camera"></button>
            <div class="jovix">
                <img src="../src/assets/img/IA JOVIX.png" alt="ia">
            </div>
            <div class="respostaia">
                <p>Resposta gerada por IA</p>
            </div>
            <div class="conteudojovix">
                <p>Gostaria de ver o banco de questões?</p>
                <p>Ou a galeria de imagens?</p>
            </div>
            <div class="botoes">
                <button id="btn-materias">MATÉRIAS</button>
                <button id="btn-banco">BANCO DE QUESTÕES</button>
            </div>
            
            
            <div class="caixatexto">
                <input type="text" placeholder="Pergunte alguma coisa..." class="texto">
                <div class="enviar">
                    <img src="../src/assets/img/enviar.png">
                </div>
            </div>
            

            

        </div>
    </main>

    <footer>
        <p>&copy;- 2026- Todos os direitos reservados.</p>
    </footer>

    <script src="../src/js/galeria.js"></script>
</body>
</html>
